// adds any strategy/sub/group/project present in the current SEED but missing from saved data (matched by code/id),
// without touching anything the user already edited or entered results for.
function mergeSeedUpdates(data){
  var seed = seedStrategies();
  seed.forEach(function(seedStrat){
    var strat = data.strategies.filter(function(s){ return s.code===seedStrat.code; })[0];
    if (!strat) { data.strategies.push(seedStrat); return; }
    seedStrat.subs.forEach(function(seedSub){
      var sub = strat.subs.filter(function(u){ return u.id===seedSub.id; })[0];
      if (!sub) { strat.subs.push(seedSub); return; }
      seedSub.groups.forEach(function(seedGroup){
        var group = sub.groups.filter(function(g){ return g.id===seedGroup.id; })[0];
        if (!group) { sub.groups.push(seedGroup); return; }
        seedGroup.projects.forEach(function(seedProj){
          var existingProj = group.projects.filter(function(p){ return p.name===seedProj.name; })[0];
          if (!existingProj) { group.projects.push(seedProj); return; }
          if (seedProj.detail && !data.details[existingProj.id]) { data.details[existingProj.id] = seedProj.detail; }
        });
      });
    });
  });
  data.seedVersion = SEED_VERSION;
  syncSeedDetails(data);
  return data;
}

  if (data.seedVersion !== SEED_VERSION) {
    if (HARD_RESET_VERSIONS.indexOf(SEED_VERSION) !== -1 && data.seedVersion < SEED_VERSION) {
      data.strategies = seedStrategies();
      data.seedVersion = SEED_VERSION;
    } else {
      data = mergeSeedUpdates(data);
    }
  }
  return data;
}

/* ---------- Google Sheet as the shared database ----------
   The whole dataset travels as ONE JSON snapshot with a revision number, so every
   device converges on the same state instead of each keeping its own localStorage copy.
   localStorage stays as the offline cache / fallback when the sheet is unreachable. */
var CLOUD = { state:'idle', msg:'', lastSync:null, pushTimer:null, pulling:false };
var SYNC_KEYS = ['strategies','fiscalYears','currentQuarter','entries','details','kpiValues','users','departments','seedVersion','sampleSeeded'];

function snapshotOut(){
  var out = {};
  SYNC_KEYS.forEach(function(k){ if (D[k] !== undefined) out[k] = D[k]; });
  return out;
}
function cloudStatusText(){
  if (!D.sheetUrl) return 'ยังไม่เชื่อม Google Sheet';
  if (CLOUD.state==='pulling') return 'กำลังดึงข้อมูลจากชีต…';
  if (CLOUD.state==='pushing') return 'กำลังบันทึกขึ้นชีต…';
  if (CLOUD.state==='error') return CLOUD.msg || 'เชื่อมต่อชีตไม่สำเร็จ — ใช้ข้อมูลในเครื่องชั่วคราว';
  if (CLOUD.lastSync) return 'ซิงก์แล้ว ' + CLOUD.lastSync;
  return 'เชื่อมชีตแล้ว';
}
function stampSync(){
  var d = new Date();
  CLOUD.lastSync = ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}

// Debounced so typing a field doesn't fire one request per keystroke.
function cloudPush(immediate){
  if (!D.sheetUrl) return;
  if (CLOUD.pushTimer) clearTimeout(CLOUD.pushTimer);
  var run = function(){
    CLOUD.pushTimer = null;
    CLOUD.state = 'pushing'; renderCloudBadge();
    D.rev = Date.now();
    fetch(D.sheetUrl, {
      method: 'POST',
      headers: { 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ type:'snapshot', rev: D.rev, by: (currentUser()||{}).username||'', payload: snapshotOut() })
    }).then(function(r){ return r.json().catch(function(){ return {}; }); })
      .then(function(){ CLOUD.state='ok'; CLOUD.msg=''; stampSync(); saveData(); renderCloudBadge(); })
      .catch(function(){ CLOUD.state='error'; CLOUD.msg='ส่งขึ้นชีตไม่สำเร็จ — บันทึกไว้ในเครื่องแล้ว'; renderCloudBadge(); });
  };
  if (immediate) run(); else CLOUD.pushTimer = setTimeout(run, 1200);
}

function saveLocalOnly(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(D)); } catch(e){}
}
function cloudPull(opts){
  opts = opts || {};
  if (!D.sheetUrl) { if (opts.report) { CLOUD.state='error'; CLOUD.msg='กรุณากรอก URL ก่อน'; render(); } return; }
  CLOUD.pulling = true; CLOUD.state='pulling'; renderCloudBadge();
  // CLOUD.pulling must stay true until every write below is done, otherwise saveData()
  // queues a push and the app echoes the sheet's own data straight back at it.
  var done = function(){ CLOUD.pulling = false; render(); };
  fetch(D.sheetUrl + (D.sheetUrl.indexOf('?')>-1?'&':'?') + 'type=snapshot&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(res){
      var remote = res && (res.payload || res.data);
      if (typeof remote === 'string') { try { remote = JSON.parse(remote); } catch(e){ remote = null; } }
      if (!remote || !remote.strategies) {
        // sheet is empty — seed it from this device so there is a baseline to share
        CLOUD.state='ok'; CLOUD.msg=''; stampSync();
        if (opts.report) CLOUD.msg='ชีตยังว่าง — ส่งข้อมูลจากเครื่องนี้ขึ้นเป็นชุดเริ่มต้นแล้ว';
        CLOUD.pulling = false;
        cloudPush(true);
        render(); return;
      }
      var remoteRev = Number(res.rev||remote.rev||0), localRev = Number(D.rev||0);
      if (!opts.force && remoteRev && localRev && remoteRev < localRev) {
        CLOUD.state='ok'; stampSync();
        CLOUD.msg='ข้อมูลในเครื่องใหม่กว่าชีต — กด “ส่งขึ้นชีต” เพื่ออัปเดตให้ทุกคน';
        done(); return;
      }
      SYNC_KEYS.forEach(function(k){ if (remote[k] !== undefined) D[k] = remote[k]; });
      D.rev = remoteRev || Date.now();
      ensureAuthData(D);
      saveLocalOnly();
      CLOUD.state='ok'; CLOUD.msg=''; stampSync();
      done();
    })
    .catch(function(){
      CLOUD.state='error';
      CLOUD.msg='ดึงข้อมูลจากชีตไม่สำเร็จ — ใช้ข้อมูลในเครื่องชั่วคราว';

    });
}

// Captures where the caret and scroll were, so saving a field mid-typing doesn't
// throw the page back to the top or drop focus (the "เด้งไปเด้งมา" problem).
var KEY_FIELDS = ['act','pid','kid','f','si','ui','gi','pi','q','uidx','did'];
function captureUiPosition(){
  var a = document.activeElement;
  var snap = { scrollY: window.scrollY, mainScroll: 0, modalScroll: 0, key: null, start: null, end: null };
  var main = document.querySelector('.main');
  if (main) snap.mainScroll = main.scrollTop;
  var mb = document.querySelector('.modal-backdrop');
  if (mb) snap.modalScroll = mb.scrollTop;
  if (a && a.dataset && a.dataset.act) {
    snap.key = KEY_FIELDS.map(function(k){ return k+'='+(a.dataset[k]||''); }).join('&');
    try { snap.start = a.selectionStart; snap.end = a.selectionEnd; } catch(e){}
  }
  return snap;
}
function focusKeyFor(act, attrs){
  return KEY_FIELDS.map(function(n){ return n+'='+(n==='act'?act:(attrs[n]!=null?attrs[n]:'')); }).join('&');
}
function restoreUiPosition(snap){
  if (!snap) return;
  var main = document.querySelector('.main');
  if (main && snap.mainScroll) main.scrollTop = snap.mainScroll;
  var mb = document.querySelector('.modal-backdrop');
  if (mb && snap.modalScroll) mb.scrollTop = snap.modalScroll;
  if (snap.scrollY) window.scrollTo(0, snap.scrollY);
  // an explicit focus request (e.g. a row that was just added) wins over restoring the old caret
  var wantKey = UI.focusKey || snap.key;
  UI.focusKey = null;
  if (!wantKey) return;
  var target = null;
  document.querySelectorAll('[data-act]').forEach(function(el){
    if (target) return;
    var k = KEY_FIELDS.map(function(n){ return n+'='+(el.dataset[n]||''); }).join('&');
    if (k===wantKey) target = el;
  });
  if (!target) return;
  try {
    target.focus({ preventScroll:true });
    if (wantKey===snap.key && snap.start!=null && target.setSelectionRange) target.setSelectionRange(snap.start, snap.end);
  } catch(e){}
}

/* ---------- sample filled form (from the official แผนปฏิบัติการ template) ---------- */
function seedSampleDetail(data){
  if (data.sampleVersion === 2) return;
  // Remove any earlier sample project so re-seeding never duplicates it.
  data.strategies.forEach(function(s){ s.subs.forEach(function(u){ u.groups.forEach(function(g){
    g.projects = g.projects.filter(function(p){ return !p.sample; });
  }); }); });
  // The sample is its OWN project — never overwrite a real project the user may have filled in.
  var host = null;
  data.strategies.forEach(function(s){ s.subs.forEach(function(u){ u.groups.forEach(function(g){
    if (!host && /1\.1\.1/.test(g.id)) host = g;
  }); }); });
  if (!host) { data.strategies.forEach(function(s){ s.subs.forEach(function(u){ u.groups.forEach(function(g){ if (!host) host = g; }); }); }); }
  if (!host) { data.sampleVersion = 2; return; }
  var pid = 'sample-corporate-health';
  var sampleProject = {

function downloadText(filename, text, mime){
  var blob = new Blob([text], { type: (mime||'text/csv')+';charset=utf-8' });
  var a = document.createElement('a');

}

/* ---------- dashboard ---------- */
function computeStatusCounts(projects, q){
  var notStarted=0, inProgress=0, done=0;
  projects.forEach(function(p){
    var st = getEntry(p.id, q).status;
    if (st==='สำเร็จ') done++; else if (st==='กำลังดำเนินการ'||st==='ล่าช้า') inProgress++; else notStarted++;
  });
  return { notStarted:notStarted, inProgress:inProgress, done:done, total:projects.length };
}
function groupStatusCounts(g, q){ return computeStatusCounts(g.projects, q); }
function urgentProjects(projects){ return visibleProjects(projects); }
function eachGroup(cb, strategies){ (strategies||visibleStrategies()).forEach(function(s){ s.subs.forEach(function(u){ u.groups.forEach(function(g){ cb(g,s,u); }); }); }); }

      statCard('กลุ่มโครงการ', (function(){var n=0;eachGroup(function(){n++}, strategies);return n;})(), '#241b1c') + statCard('โครงการ', totalProjects, '#8f2436') +
    '</div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:26px">'+stratCards+'</div>' +
    '<div style="border-radius:16px;padding:24px 26px;margin-bottom:26px;background:linear-gradient(120deg,#5e1523 0%,#8f2436 100%);color:#fff">' +

function statCard(label,value,color){ return '<div class="card" style="padding:16px 18px"><div style="font-size:11.5px;color:#7a6f6e;font-weight:500">'+label+'</div><div class="mono" style="font-size:30px;font-weight:600;margin-top:10px;color:'+color+'">'+value+'</div></div>'; }
function loopStep(title,desc){ return '<div style="background:rgba(255,255,255,.1);border-radius:12px;padding:15px 16px"><div class="mono" style="font-size:12px;color:#f2b526;letter-spacing:.08em;font-weight:600">'+title+'</div><div style="font-size:12px;line-height:1.65;margin-top:9px;color:rgba(255,255,255,.88)">'+desc+'</div></div>'; }

function renderTimelineTable(strategies){
  var quarters = fyQuarters(D.fiscalYears);
  var head = quarters.map(function(q){
    var isCur = q===D.currentQuarter;
    return '<th class="tl-qhead" data-act="tl-set-quarter" data-q="'+esc(q)+'" title="คลิกเพื่อเน้นไตรมาสนี้" style="text-align:center;padding:11px 6px;font-family:\'IBM Plex Mono\';font-size:10.5px;font-weight:600;cursor:pointer;color:'+(isCur?'#8f2436':'#7a6f6e')+';background:'+(isCur?'#fdf1f2':'transparent')+';border-radius:8px 8px 0 0">'+q+'</th>';
  }).join('');
  var rows = ''; eachGroup(function(g,s,u){
    var projs = urgentProjects(g.projects);
    if (UI.urgentOnly && !projs.length) return;
    var cells = quarters.map(function(q){
      var c = computeStatusCounts(projs,q);
      var color = STATUS_COLORS['ยังไม่เริ่ม'];
      var statuses = projs.map(function(p){ return getEntry(p.id,q).status; });
      if (statuses.some(function(x){return x==='ล่าช้า';})) color = STATUS_COLORS['ล่าช้า'];
      else if (statuses.length && statuses.every(function(x){return x==='สำเร็จ';})) color = STATUS_COLORS['สำเร็จ'];
      else if (statuses.some(function(x){return x==='กำลังดำเนินการ'||x==='สำเร็จ';})) color = STATUS_COLORS['กำลังดำเนินการ'];
      var isCur = q===D.currentQuarter;
      var avg = projs.length ? Math.round(projs.reduce(function(a,p){ return a + (Number(getEntry(p.id,q).percent)||0); },0) / projs.length) : 0;
      // light status fills need dark ink; only the deep green/red take white
      var lightFill = color===STATUS_COLORS['ยังไม่เริ่ม'] || color===STATUS_COLORS['กำลังดำเนินการ'];
      var ink = lightFill ? '#4c4241' : '#fff';
      return '<td style="padding:8px 6px;background:'+(isCur?'#fdf1f2':'transparent')+'">' +
        '<div class="tl-cell" data-act="tl-drill" data-gid="'+esc(g.id)+'" data-q="'+esc(q)+'" title="'+esc(g.name)+' · '+q+' — สำเร็จ '+c.done+'/'+c.total+' · เฉลี่ย '+avg+'% (คลิกเพื่อดูโครงการ)" style="position:relative;width:100%;height:24px;border-radius:7px;background:'+color+';cursor:pointer;overflow:hidden">' +
          (avg>0 ? '<div style="position:absolute;inset:0 auto 0 0;width:'+Math.min(100,avg)+'%;background:rgba(255,255,255,.18)"></div>' : '') +
          '<span class="mono" style="position:relative;display:flex;align-items:center;justify-content:center;height:100%;font-size:10.5px;font-weight:700;color:'+ink+'">'+c.done+'/'+c.total+'</span>' +
        '</div></td>';
    }).join('');
    rows += '<tr style="border-top:1px solid #f2eceb"><td style="padding:12px 14px">' +
      '<div class="tl-group" data-act="tl-drill" data-gid="'+esc(g.id)+'" data-q="'+esc(D.currentQuarter)+'" style="cursor:pointer">' +
        '<div style="font-size:12.5px;font-weight:500">'+esc(g.name)+'</div>' +
        '<div class="mono" style="font-size:10.5px;color:#9b8f8e;margin-top:3px">'+esc(g.id)+' · ยุทธศาสตร์ '+esc(s.code)+' <span style="color:#8f2436">›</span></div>' +
      '</div></td>'+cells+'</tr>';
  }, strategies);
  var legend = STATUS_LIST.map(function(l){ return '<div class="row" style="gap:8px"><span style="width:14px;height:14px;border-radius:4px;background:'+STATUS_COLORS[l]+'"></span>'+l+'</div>'; }).join('');
  return '<div class="card" style="padding:6px 8px 10px;overflow-x:auto"><table class="table" style="min-width:900px"><thead><tr><th style="width:280px">กลุ่มกลยุทธ์</th>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div>' +
    '<div class="row no-print" style="gap:20px;margin-top:16px;font-size:12px;color:#4c4241;flex-wrap:wrap">'+legend+
      '<div style="font-size:11.5px;color:#9b8f8e">ตัวเลขในช่อง = สำเร็จ/ทั้งหมด · แถบสว่าง = % เฉลี่ย · คลิกช่องเพื่อดูโครงการ</div>' +
    '</div>';
}

function renderTimelineDrill(){

  if (!found) return '';
  var projs = visibleProjects(found.g.projects);
  var c = computeStatusCounts(projs, q);
  var avg = projs.length ? Math.round(projs.reduce(function(a,p){ return a + (Number(getEntry(p.id,q).percent)||0); },0) / projs.length) : 0;
  var quarters = fyQuarters(D.fiscalYears);
  var rows = projs.map(function(p){

    return '<div class="row" style="gap:12px;padding:12px 4px;border-top:1px solid #f2eceb;cursor:pointer;align-items:flex-start" data-act="tl-open-project" data-pid="'+esc(p.id)+'">' +

      '</div>' +
      '<div style="flex:none;text-align:right">'+statusPill(e.status)+'<div class="mono" style="font-size:12px;color:#8f2436;font-weight:600;margin-top:5px">'+(Number(e.percent)||0)+'%</div></div>' +
      '<div style="flex:none;color:#c2b5b4">›</div>' +
    '</div>';

  var qTabs = quarters.map(function(x){

    return '<button type="button" class="btn '+(on?'':'btn-ghost')+'" data-act="tl-drill-quarter" data-q="'+esc(x)+'" style="padding:6px 11px;font-size:11px;'+(on?'':'color:#7a6f6e')+'">'+x+'</button>';

        '<div><div class="eyebrow">'+esc(found.g.id)+' · ยุทธศาสตร์ '+esc(found.s.code)+'</div>' +
          '<div style="font-size:16px;font-weight:600;margin-top:5px">'+esc(found.g.name)+'</div>' +
          '<div class="muted" style="font-size:11.5px;margin-top:4px">กลยุทธ์ '+esc(found.u.id)+' — '+esc(found.u.name)+'</div></div>' +
        '<button class="btn btn-ghost" data-act="tl-drill-close" style="padding:6px 11px;font-size:12px">ปิด</button>' +
      '</div>' +
      '<div class="row" style="gap:10px;margin-top:14px;flex-wrap:wrap">' +
        '<span class="pill" style="background:#f6f1f0">ทั้งหมด '+c.total+'</span>' +
        '<span class="pill" style="background:#fdf6e5;color:#7a5b06">ดำเนินการ '+c.inProgress+'</span>' +

    '</div>' +
  '</div></div>';

/* ---------- actions ---------- */
function attachActions(root){
  root.querySelectorAll('[data-act]').forEach(function(el){
    var act = el.getAttribute('data-act');
    var isInput = el.tagName==='INPUT' || el.tagName==='SELECT' || el.tagName==='TEXTAREA';
    el.addEventListener(isInput ? 'change' : 'click', function(e){ handleAction(act, el, e); });
  });
  var importInput = document.getElementById('import-file-input');
  if (importInput) importInput.addEventListener('change', handleImport);
}

function handleAction(act, el, e){
  var ds = el.dataset;
  var si = ds.si!==undefined ? Number(ds.si) : null, ui = ds.ui!==undefined ? Number(ds.ui) : null, gi = ds.gi!==undefined ? Number(ds.gi) : null, pi = ds.pi!==undefined ? Number(ds.pi) : null;

  if (act==='noop'){ return; }
  if (act==='show-register'){ UI.authView='register'; UI.authError=''; UI.authMsg=''; render(); return; }
  if (act==='show-login'){ UI.authView='login'; UI.authError=''; render(); return; }
  if (act==='do-login'){
    var un = (document.getElementById('login-user')||{}).value || '';
    var pw = (document.getElementById('login-pw')||{}).value || '';
    var found = (D.users||[]).filter(function(x){ return x.username===un.trim(); })[0];
    if (!found) { UI.authError='ไม่พบชื่อผู้ใช้นี้'; render(); return; }
    if (found.status==='pending') { UI.authError='บัญชีนี้รอผู้ดูแลระบบอนุมัติ'; render(); return; }
    if (found.pw !== hashPw(pw)) { UI.authError='รหัสผ่านไม่ถูกต้อง'; render(); return; }
    try { sessionStorage.setItem(SESSION_KEY, found.id); } catch(e2){}
    UI.authError=''; UI.authMsg=''; UI.tab='dashboard'; render(); return;
  }
  if (act==='do-register'){
    var g = function(id){ return ((document.getElementById(id)||{}).value||'').trim(); };
    var rn = g('reg-name'), ru = g('reg-user'), rp = g('reg-pw');
    if (!rn || !ru || !rp) { UI.authError='กรอกชื่อ-นามสกุล, username และรหัสผ่านให้ครบ'; render(); return; }
    if ((D.users||[]).some(function(x){ return x.username===ru; })) { UI.authError='username นี้ถูกใช้แล้ว'; render(); return; }
    D.users.push({ id: uid(), username: ru, name: rn, role: g('reg-role')||'user', deptId: g('reg-dept'), email: g('reg-email'), phone:'', status:'pending', pw: hashPw(rp), createdAt: new Date().toISOString() });
    saveData();
    UI.authView='login'; UI.authError=''; UI.authMsg='ส่งคำขอเรียบร้อย — รอผู้ดูแลระบบอนุมัติก่อนเข้าใช้งาน';
    render(); return;
  }
  if (act==='logout'){ try { sessionStorage.removeItem(SESSION_KEY); } catch(e2){} UI.authView='login'; UI.authError=''; UI.authMsg=''; render(); return; }
  if (act==='toggle-sidebar'){ UI.sidebarCollapsed = !UI.sidebarCollapsed; try { localStorage.setItem('thamc_sb', UI.sidebarCollapsed?'1':'0'); } catch(e2){} render(); return; }
  if (act==='set-settings-tab'){ UI.settingsTab = ds.stab; render(); return; }
  if (act==='set-forms-tab'){ UI.formsTab = ds.ftab; render(); return; }
  if (act==='open-sample-form'){
    UI.previewProjectId = 'sample-corporate-health'; render(); return;
  }
  if (act==='dl-template'){ downloadText('THAMC-เทมเพลตนำเข้าโครงการ.csv', buildTemplateCsv()); return; }
  if (act==='dl-current-projects'){
    var lines = [TEMPLATE_COLS.map(csvCell).join(',')];
    eachProject(function(p, ctx){
      var dt = getDetail(p.id);
      var k0 = (dt.kpis||[])[0] || {};
      lines.push([ctx.s.code, ctx.u.id, ctx.g.id, p.name, p.desc||'', deptName(dt.deptId), dt.owner, dt.target, dt.output, dt.area, dt.budget,
        fyMonths(D.fiscalYears)[dt.startMonth||0]||'', fyMonths(D.fiscalYears)[dt.endMonth||0]||'', D.fiscalYears[0]||'', D.fiscalYears[D.fiscalYears.length-1]||'',
        k0.name||'', k0.target==null?'':k0.target, k0.unit||'', p.priority?'Y':'N', dt.adminNote||''].map(csvCell).join(','));
    }, D.strategies);
    downloadText('THAMC-โครงการปัจจุบัน.csv', '\uFEFF' + lines.join('\r\n')); return;
  }
  if (act==='report-toggle'){ UI.reportSel[ds.pid] = !UI.reportSel[ds.pid]; render(); return; }
  if (act==='report-select-all'){ UI.reportSel = {}; eachProject(function(p){ if (isActiveProject(p)) UI.reportSel[p.id]=true; }, D.strategies); render(); return; }
  if (act==='report-clear'){ UI.reportSel = {}; render(); return; }
  if (act==='report-quarter'){ UI.reportQuarter = el.value.replace(' (ปัจจุบัน)',''); render(); return; }
  if (act==='report-print'){ window.print(); return; }
  if (act==='set-forms-tab-noop'){ return; }

  if (act==='plan-status'){ setEntry(ds.pid, UI.entryQuarter, { status: el.value }); render(); return; }
  if (act==='plan-percent'){ setEntry(ds.pid, UI.entryQuarter, { percent: Math.max(0, Math.min(100, Number(el.value)||0)) }); render(); return; }
  if (act==='set-entry-quarter'){ UI.entryQuarter = el.value; render(); return; }
  if (act==='toggle-strat'){ UI.openStrat[ds.code] = UI.openStrat[ds.code]===false; render(); return; }

function handleImport(e){
  var file = e.target.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var parsed = JSON.parse(reader.result);
      if (!parsed.strategies || !Array.isArray(parsed.strategies)) throw new Error('bad shape');
      if (!confirm('นำเข้าไฟล์นี้จะแทนที่ข้อมูลยุทธศาสตร์/ผลดำเนินงานทั้งหมดในระบบ ยืนยันหรือไม่?')) return;
      parsed.strategies.forEach(function(s){ s.subs.forEach(function(u){ u.groups.forEach(function(g){ g.projects.forEach(function(p){ if(!p.id) p.id = uid(); }); }); }); });
      D = Object.assign({ entries:{}, details:{}, sheetUrl:'', fiscalYears:['2568','2569'], currentQuarter:'2569 Q4' }, parsed);
      saveData();
      UI.importMsg = 'นำเข้าข้อมูลสำเร็จ';
      render();
    } catch(err) {
      UI.importMsg = 'ไฟล์ไม่ถูกต้อง — ต้องเป็น JSON ที่มีโครงสร้าง {strategies:[...]} (ดาวน์โหลดตัวอย่างได้จากปุ่ม "ดาวน์โหลดข้อมูล")';
      render();
    }
  };
  reader.readAsText(file);
}

render();
// the sheet is the source of truth: pick up whatever other devices saved
if (D.sheetUrl) cloudPull();
window.onafterprint = function(){
  document.body.classList.remove('printing-project');
  if (UI.printFilter) { UI.printFilter = null; render(); }
  if (UI.printProjectId) { UI.printProjectId = null; render(); }
};
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
