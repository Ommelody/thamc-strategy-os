function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function seedStrategies(){
  var data = JSON.parse(JSON.stringify(SEED_STRATEGIES));
  data.forEach(function(s){ s.subs.forEach(function(u){ u.groups.forEach(function(g){ g.projects.forEach(function(p){ p.id = uid(); }); }); }); });
  return data;
}

function fyMonths(fys){
  var out = [];
  fys.forEach(function(fy){
    var py = String(Number(fy)-1).slice(-2), cy = String(Number(fy)).slice(-2);
    for (var m=9;m<12;m++) out.push(THAI_MONTHS[m]+' '+py);
    for (var m2=0;m2<9;m2++) out.push(THAI_MONTHS[m2]+' '+cy);
  });
  return out;
}
function fyQuarters(fys){
  var out = [];
  fys.forEach(function(fy){ ['Q1','Q2','Q3','Q4'].forEach(function(q){ out.push(fy+' '+q); }); });
  return out;
}

var HARD_RESET_VERSIONS = [8]; // versions where the data model changed shape — replace strategies wholesale instead of merging

// pulls any project.detail baked into the seed into data.details (only if that project has no detail yet), then strips it off the project object
function syncSeedDetails(data){
  data.strategies.forEach(function(s){ s.subs.forEach(function(u){ u.groups.forEach(function(g){ g.projects.forEach(function(p){
    if (p.detail) { if (!data.details[p.id]) data.details[p.id] = p.detail; delete p.detail; }
  }); }); }); });
}

// adds any strategy/sub/group/project present in the current SEED but missing from saved data (matched by code/id),
// without touching anything the user already edited or entered results for.
function mergeSeedUpdates(data){
  var seed = seedStrategies();
  seed.forEach(function(seedStrat){
    var strat = data.strategies.filter(function(s){ return s.code===seedStrat.code; })[0];
    if (!strat) { data.strategies.push(seedStrat); return; }
    seedStrat.subs.forEach(function(seedSub){
      var sub = strat.subs.filter(function(u){ return u.id===seedSub.id; })[0];
      if (!sub) { strat.subs.push(seedSub); return; }
      seedSub.groups.forEach(function(seedGroup){
        var group = sub.groups.filter(function(g){ return g.id===seedGroup.id; })[0];
        if (!group) { sub.groups.push(seedGroup); return; }
        seedGroup.projects.forEach(function(seedProj){
          var existingProj = group.projects.filter(function(p){ return p.name===seedProj.name; })[0];
          if (!existingProj) { group.projects.push(seedProj); return; }
          if (seedProj.detail && !data.details[existingProj.id]) { data.details[existingProj.id] = seedProj.detail; }
        });
      });
    });
  });
  data.seedVersion = SEED_VERSION;
  syncSeedDetails(data);
  return data;
}

function loadData(){
  var data;
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) data = JSON.parse(raw);
  } catch(e){}
  if (!data) { var fresh = { strategies: seedStrategies(), fiscalYears: ['2568','2569'], currentQuarter: '2569 Q4', entries: {}, details: {}, sheetUrl: '', seedVersion: SEED_VERSION }; syncSeedDetails(fresh); return fresh; }
  if (data.seedVersion !== SEED_VERSION) {
    if (HARD_RESET_VERSIONS.indexOf(SEED_VERSION) !== -1 && data.seedVersion < SEED_VERSION) {
      data.strategies = seedStrategies();
      data.seedVersion = SEED_VERSION;
    } else {
      data = mergeSeedUpdates(data);
    }
  }
  return data;
}

function getEntry(pid, q){ return (D.entries[pid+'__'+q]) || { status:'ยังไม่เริ่ม', percent:0, note:'' }; }

function setDetail(pid, patch){ D.details[pid] = Object.assign({}, getDetail(pid), patch); saveData(); }
function calcKpiPercent(kpis, values){
  var valid = (kpis||[]).filter(function(k){ return Number(k.target)>0; });
  if (!valid.length) return null;
  var sum = valid.reduce(function(acc,k){ var v=(values&&values[k.id])||{}; return acc + Math.min(100, Math.max(0, (Number(v.current)||0)/Number(k.target)*100)); }, 0);
  return Math.round(sum/valid.length);
}
function getKpiValues(pid, q){ return (D.kpiValues && D.kpiValues[pid+'__'+q]) || {}; }
function getKpiValue(pid, q, kid){ return getKpiValues(pid,q)[kid] || { current:'', fileName:'', fileData:'' }; }
function setKpiValue(pid, q, kid, patch){
  D.kpiValues = D.kpiValues || {};
  var key = pid+'__'+q;
  D.kpiValues[key] = Object.assign({}, D.kpiValues[key]||{});
  D.kpiValues[key][kid] = Object.assign({}, getKpiValue(pid,q,kid), patch);
  saveData();
}
function applyKpiPercent(pid, q){
  var det = getDetail(pid);
  var pct = calcKpiPercent(det.kpis, getKpiValues(pid, q));
  if (pct===null) return;
  var patch = { percent: pct };
  if (pct>=100) patch.status='สำเร็จ'; else if (pct>0) patch.status='กำลังดำเนินการ';
  setEntry(pid, q, patch);
}

}

  var strategies = visibleStrategies();
  var totalProjects=0; eachProject(function(){ totalProjects++; }, strategies);
  var stratCards = strategies.map(function(s){
    var count=0, done=0, subCount=s.subs.length;
    s.subs.forEach(function(u){ u.groups.forEach(function(g){ g.projects.forEach(function(p){ count++; if (getEntry(p.id, D.currentQuarter).status==='สำเร็จ') done++; }); }); });
    var pct = count ? Math.round(done/count*100) : 0;
    return '<div class="card" style="padding:22px 24px;cursor:pointer" data-act="open-strat-preview" data-code="'+esc(s.code)+'">' +
      '<div class="row" style="gap:11px"><div style="width:40px;height:40px;border-radius:11px;background:#fdf1f2;color:#8f2436;display:flex;align-items:center;justify-content:center;font:600 17px \'IBM Plex Mono\'">'+esc(s.code)+'</div><div style="font-size:11.5px;color:#9b8f8e">ยุทธศาสตร์ที่ '+esc(s.code)+'</div></div>' +
      '<div style="font-size:18px;font-weight:600;margin:14px 0 7px">'+esc(s.name)+'</div>' +
      '<div style="font-size:12px;color:#7a6f6e;line-height:1.7">'+esc(s.goal)+'</div>' +
      '<div class="row" style="margin:14px 0 18px"><span class="pill">'+count+' โครงการ</span><span class="pill">'+subCount+' กลยุทธ์</span></div>' +
      '<div class="row" style="gap:10px;margin-bottom:9px"><span class="mono" style="font-size:30px;font-weight:600">'+pct+'%</span><span style="font-size:11.5px;color:#9b8f8e">ความสำเร็จรอบนี้</span></div>' +
      '<div style="height:8px;border-radius:8px;background:#efe7e6;overflow:hidden"><div style="height:100%;border-radius:8px;background:linear-gradient(90deg,#8f2436,#f2b526);width:'+pct+'%"></div></div>' +
    '</div>';
  }).join('');

  var groupCards = ''; eachGroup(function(g,s,u){
    var c = groupStatusCounts(g, D.currentQuarter);
    var pct = c.total ? Math.round((c.done+c.inProgress)/c.total*100) : 0;
    groupCards += '<div class="card" style="padding:18px 20px">' +
      '<div class="row" style="justify-content:space-between"><span class="pill" style="background:#fdf1f2;color:#8f2436">'+esc(g.id)+'</span><span class="mono" style="font-size:13px;color:#9b8f8e">'+c.total+'</span></div>' +
      '<div style="font-size:13.5px;font-weight:600;margin:12px 0 4px">'+esc(g.name)+'</div>' +
      '<div style="font-size:11px;color:#9b8f8e;margin-bottom:14px">ยุทธศาสตร์ '+esc(s.code)+' · กลยุทธ์ '+esc(u.id)+'</div>' +
      '<div style="height:7px;border-radius:8px;background:#efe7e6;overflow:hidden;margin-bottom:10px"><div style="height:100%;border-radius:8px;background:linear-gradient(90deg,#8f2436,#f2b526);width:'+pct+'%"></div></div>' +
      '<div class="row" style="font-size:11px;gap:6px">' +
        '<span class="pill">ยังไม่เริ่ม '+c.notStarted+'</span>' +
        '<span class="pill" style="background:#fdf6e5;color:#7a5b06">ดำเนินการ '+c.inProgress+'</span>' +
        '<span class="pill" style="background:#edf6f1;color:#2f5f45">สำเร็จ '+c.done+'</span>' +
      '</div></div>';
  }, strategies);

  return '<div>' +
    '<div class="row no-print" style="justify-content:space-between;padding-bottom:18px;border-bottom:1px solid #f0eae9">' +
      '<div><div class="eyebrow">DASHBOARD</div><h1>ภาพรวมความคืบหน้า</h1><div class="muted" style="font-size:13px">สรุปสถานะยุทธศาสตร์ กลยุทธ์ และโครงการทั้งหมด '+totalProjects+' โครงการ</div></div>' +
      '<div class="row" style="gap:8px">' +
        '<button class="btn btn-outline" data-act="open-print-dialog">พิมพ์รายงาน</button>' +
        '<button class="btn" data-act="set-tab" data-tab="entry">เปิดรอบบันทึกผล</button>' +
      '</div>' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:22px 0 26px">' +
      statCard('ยุทธศาสตร์', strategies.length, '#241b1c') + statCard('กลยุทธ์', (function(){var n=0;strategies.forEach(function(s){n+=s.subs.length});return n;})(), '#241b1c') +
      statCard('กลุ่มโครงการ', (function(){var n=0;eachGroup(function(){n++}, strategies);return n;})(), '#241b1c') + statCard('โครงการ', totalProjects, '#8f2436') +
    '</div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:26px">'+stratCards+'</div>' +
    '<div style="border-radius:16px;padding:24px 26px;margin-bottom:26px;background:linear-gradient(120deg,#5e1523 0%,#8f2436 100%);color:#fff">' +
      '<div class="row" style="gap:10px"><span style="width:8px;height:8px;border-radius:50%;background:#f2b526"></span><span class="mono" style="font-size:11px;letter-spacing:.12em;color:#f2b526">LOOP ENGINEERING · OKR CHECK-IN</span></div>' +
      '<div style="font-size:19px;font-weight:600;line-height:1.45;margin:12px 0 20px;max-width:680px">ตั้งเป้า ติดตามผล ทบทวน แล้วปรับแผน — วนซ้ำทุกไตรมาส</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px">' +
        loopStep('Plan','ตั้งเป้ายุทธศาสตร์และโครงการรายไตรมาส') + loopStep('Do','เจ้าของโครงการดำเนินงานและบันทึกผล') + loopStep('Check','ผู้บริหารทบทวนผ่าน Dashboard และ Timeline') + loopStep('Act','ปรับแผนไตรมาสถัดไป แล้ววนกลับสู่ Plan') +
      '</div></div>' +
    '<h2>กลุ่มโครงการ</h2>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:26px">'+groupCards+'</div>' +
    '<h2>สถานะรายไตรมาส</h2>' + renderTimelineTable(strategies) +
  '</div>';
}
function statCard(label,value,color){ return '<div class="card" style="padding:16px 18px"><div style="font-size:11.5px;color:#7a6f6e;font-weight:500">'+label+'</div><div class="mono" style="font-size:30px;font-weight:600;margin-top:10px;color:'+color+'">'+value+'</div></div>'; }
function loopStep(title,desc){ return '<div style="background:rgba(255,255,255,.1);border-radius:12px;padding:15px 16px"><div class="mono" style="font-size:12px;color:#f2b526;letter-spacing:.08em;font-weight:600">'+title+'</div><div style="font-size:12px;line-height:1.65;margin-top:9px;color:rgba(255,255,255,.88)">'+desc+'</div></div>'; }

function renderTimelineTable(strategies){
  var quarters = fyQuarters(D.fiscalYears);
  var head = quarters.map(function(q){
    var isCur = q===D.currentQuarter;
    return '<th style="text-align:center;padding:11px 6px;font-family:\'IBM Plex Mono\';font-size:10.5px;font-weight:600;color:'+(isCur?'#8f2436':'#7a6f6e')+';background:'+(isCur?'#fdf1f2':'transparent')+';border-radius:8px 8px 0 0">'+q+'</th>';
  }).join('');
  var rows = ''; eachGroup(function(g,s,u){
    var cells = quarters.map(function(q){
      var c = groupStatusCounts(g,q);
      var color = STATUS_COLORS['ยังไม่เริ่ม'];
      var statuses = g.projects.map(function(p){ return getEntry(p.id,q).status; });
      if (statuses.some(function(x){return x==='ล่าช้า';})) color = STATUS_COLORS['ล่าช้า'];
      else if (statuses.length && statuses.every(function(x){return x==='สำเร็จ';})) color = STATUS_COLORS['สำเร็จ'];
      else if (statuses.some(function(x){return x==='กำลังดำเนินการ'||x==='สำเร็จ';})) color = STATUS_COLORS['กำลังดำเนินการ'];
      var isCur = q===D.currentQuarter;
      return '<td style="padding:8px 6px;background:'+(isCur?'#fdf1f2':'transparent')+'"><div style="width:100%;height:22px;border-radius:7px;background:'+color+'" title="'+q+'"></div></td>';
    }).join('');
    rows += '<tr style="border-top:1px solid #f2eceb"><td style="padding:12px 14px"><div style="font-size:12.5px;font-weight:500">'+esc(g.name)+'</div><div class="mono" style="font-size:10.5px;color:#9b8f8e;margin-top:3px">'+esc(g.id)+'</div></td>'+cells+'</tr>';
  }, strategies);
  var legend = STATUS_LIST.map(function(l){ return '<div class="row" style="gap:8px"><span style="width:14px;height:14px;border-radius:4px;background:'+STATUS_COLORS[l]+'"></span>'+l+'</div>'; }).join('');
  return '<div class="card" style="padding:6px 8px 10px;overflow-x:auto"><table class="table" style="min-width:900px"><thead><tr><th style="width:280px">กลุ่มกลยุทธ์</th>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div>' +
    '<div class="row no-print" style="gap:20px;margin-top:16px;font-size:12px;color:#4c4241">'+legend+'</div>';
}

/* ---------- strategy (view + edit) ---------- */
function renderStrategy(){
  var strategies = visibleStrategies();
  var body = strategies.map(function(s,si){
    var open = !!UI.openStrat[s.code];
    var header = UI.editMode ?
      ('<div style="display:grid;grid-template-columns:70px 1fr;gap:14px;align-items:start">' +
        '<input class="mono" style="text-align:center" value="'+esc(s.code)+'" data-act="strat-code" data-si="'+si+'">' +
        '<div><input style="width:100%;font-weight:600;margin-bottom:8px" value="'+esc(s.name)+'" data-act="strat-name" data-si="'+si+'">' +
        '<textarea style="width:100%" rows="2" data-act="strat-goal" data-si="'+si+'">'+esc(s.goal)+'</textarea></div>' +
      '</div>' +
      '<div style="margin-top:10px"><button class="btn btn-danger" data-act="strat-remove" data-si="'+si+'">ลบยุทธศาสตร์นี้</button></div>')
      : ('<div class="row" style="gap:18px;cursor:pointer" data-act="toggle-strat" data-si="'+si+'">' +
        '<div style="width:56px;height:56px;flex:none;border-radius:14px;background:#f2b526;color:#5e1523;display:flex;align-items:center;justify-content:center;font:600 24px \'IBM Plex Mono\'">'+esc(s.code)+'</div>' +
        '<div class="grow"><div style="font-size:10.5px;font-weight:600;letter-spacing:.14em;color:#f2b526">ยุทธศาสตร์ที่ '+esc(s.code)+'</div>' +
        '<div style="font-size:19px;font-weight:600;margin-top:6px">'+esc(s.name)+'</div>' +
        '<div style="font-size:12px;color:rgba(255,255,255,.78);line-height:1.7;margin-top:6px">'+esc(s.goal)+'</div></div>' +
        '<div style="font-size:11.5px;color:#f2b526;font-weight:500">'+(open?'ซ่อน ▲':'ขยาย ▼')+'</div></div>');

    var subsHtml = '';
    if (open || UI.editMode) {
      subsHtml = s.subs.map(function(u, ui){
        var groupsHtml = u.groups.map(function(g, gi){
          var gopen = !!UI.openGroup[g.id];
          var projHtml = (gopen || UI.editMode) ? renderProjectsList(g, si, ui, gi) : '';
          var groupHeader = UI.editMode ?
            ('<div style="display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:start;padding:12px 16px">' +
              '<input class="mono" style="font-size:11px" value="'+esc(g.id)+'" data-act="grp-id" data-si="'+si+'" data-ui="'+ui+'" data-gi="'+gi+'">' +
              '<div><input style="width:100%;margin-bottom:6px" value="'+esc(g.name)+'" data-act="grp-name" data-si="'+si+'" data-ui="'+ui+'" data-gi="'+gi+'">' +
              '<textarea style="width:100%" rows="2" data-act="grp-desc" data-si="'+si+'" data-ui="'+ui+'" data-gi="'+gi+'">'+esc(g.desc)+'</textarea>' +
              '<button class="btn btn-danger" style="margin-top:6px" data-act="grp-remove" data-si="'+si+'" data-ui="'+ui+'" data-gi="'+gi+'">ลบกลุ่มนี้</button></div></div>')
            : ('<div class="row" style="gap:12px;padding:14px 16px;cursor:pointer" data-act="toggle-group" data-gid="'+g.id+'">' +
              '<span class="pill" style="background:#fdf1f2;color:#8f2436" class="mono">'+esc(g.id)+'</span>' +
              '<span class="grow" style="font-size:13.5px;font-weight:500">'+esc(g.name)+'</span>' +
              '<span style="font-size:11px;color:#9b8f8e">'+g.projects.length+' โครงการ</span>' +
              '<span style="font-size:11.5px;color:#8f2436;font-weight:500">'+(gopen?'ซ่อน':'ดูรายการ')+'</span></div>');
          return '<div style="background:#fff;border:1px solid #e6dedd;border-radius:12px;margin:0 0 8px 16px;overflow:hidden">' + groupHeader +
            (gopen && !UI.editMode ? '<div style="padding:0 16px 16px"><div style="font-size:11.5px;color:#7a6f6e;line-height:1.7;margin-bottom:12px">'+esc(g.desc)+'</div>'+projHtml+'</div>' : (UI.editMode ? '<div style="padding:0 16px 16px">'+projHtml+'</div>' : '')) +
          '</div>';
        }).join('');
        var subHeader = UI.editMode ?
          ('<div style="display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start">' +
            '<input class="mono" style="font-size:12px" value="'+esc(u.id)+'" data-act="sub-id" data-si="'+si+'" data-ui="'+ui+'">' +
            '<div><input style="width:100%;font-weight:600;margin-bottom:6px" value="'+esc(u.name)+'" data-act="sub-name" data-si="'+si+'" data-ui="'+ui+'">' +
            '<textarea style="width:100%" rows="2" data-act="sub-desc" data-si="'+si+'" data-ui="'+ui+'">'+esc(u.desc)+'</textarea>' +
            '<button class="btn btn-danger" style="margin-top:6px" data-act="sub-remove" data-si="'+si+'" data-ui="'+ui+'">ลบกลยุทธ์นี้</button></div></div>')
          : ('<div class="row" style="gap:10px"><span class="mono" style="font-size:12px;padding:5px 11px;border-radius:8px;background:#8f2436;color:#fff">กลยุทธ์ '+esc(u.id)+'</span><span style="font-size:16px;font-weight:600">'+esc(u.name)+'</span></div>' +
            '<div style="font-size:12.5px;color:#7a6f6e;line-height:1.75;margin:10px 0 16px">'+esc(u.desc)+'</div>');
        return '<div style="border-left:3px solid #f2b526;padding:4px 0 4px 18px;margin:22px 0 10px">' + subHeader + groupsHtml +
          (UI.editMode ? '<button class="btn btn-ghost" style="margin:6px 0 0 16px" data-act="grp-add" data-si="'+si+'" data-ui="'+ui+'">+ เพิ่มกลุ่มโครงการ</button>' : '') +
        '</div>';
      }).join('') + (UI.editMode ? '<button class="btn btn-ghost" style="margin-top:10px" data-act="sub-add" data-si="'+si+'">+ เพิ่มกลยุทธ์</button>' : '');
    }

    return '<div class="card" style="margin-bottom:14px;overflow:hidden">' +
      '<div style="padding:22px 24px;'+(UI.editMode?'':'background:linear-gradient(120deg,#5e1523 0%,#8f2436 100%);color:#fff')+'">' + header + '</div>' +
      (open || UI.editMode ? '<div style="padding:4px 24px 22px;background:#fff">' + subsHtml + '</div>' : '') +
    '</div>';
  }).join('');

  return '<div>' +
    '<div class="row no-print" style="justify-content:space-between">' +
      '<div><div class="eyebrow">STRATEGY MAP</div><h1>รายละเอียดยุทธศาสตร์</h1><div class="muted" style="font-size:13px;margin-bottom:10px">ยุทธศาสตร์ › กลยุทธ์ › กลุ่มโครงการ › โครงการ / กิจกรรม</div></div>' +
      '<div class="row" style="gap:8px">' +
        '<button class="btn btn-outline" data-act="open-print-dialog">พิมพ์รายงาน</button>' +
        '<button class="btn '+(UI.editMode?'':'btn-outline')+'" data-act="toggle-edit">'+(UI.editMode?'ออกจากโหมดแก้ไข':'แก้ไขโครงสร้าง')+'</button>' +
      '</div>' +
    '</div>' +
    '<div style="margin-top:14px">' + body + '</div>' +
    (UI.editMode ? '<button class="btn btn-ghost" data-act="strat-add">+ เพิ่มยุทธศาสตร์ใหม่</button>' : '') +
  '</div>';
}

function priorityBadge(p, style){
  if (!p.priority) return '';
  return '<span class="mono" style="display:inline-block;padding:2px 7px;border-radius:10px;font-size:9.5px;font-weight:600;background:#f2b526;color:#4a3708;'+(style||'')+'">เร่งด่วน 2569</span>';
}
function renderProjectsList(g, si, ui, gi){
  if (UI.editMode) {
    var rows = g.projects.map(function(p, pi){
      return '<div style="display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid #f2eceb">' +
        '<div><input style="width:100%;margin-bottom:6px" value="'+esc(p.name)+'" data-act="proj-name" data-si="'+si+'" data-ui="'+ui+'" data-gi="'+gi+'" data-pi="'+pi+'">' +
        '<textarea style="width:100%" rows="2" data-act="proj-desc" data-si="'+si+'" data-ui="'+ui+'" data-gi="'+gi+'" data-pi="'+pi+'">'+esc(p.desc||'')+'</textarea></div>' +
        '<button class="btn btn-danger" data-act="proj-remove" data-si="'+si+'" data-ui="'+ui+'" data-gi="'+gi+'" data-pi="'+pi+'">ลบ</button></div>';
    }).join('');
    return rows + '<button class="btn btn-ghost" style="margin-top:8px" data-act="proj-add" data-si="'+si+'" data-ui="'+ui+'" data-gi="'+gi+'">+ เพิ่มโครงการ</button>';
  }
  var trs = g.projects.map(function(p,idx){
    return '<tr style="border-top:1px solid #f2eceb"><td style="padding:12px;vertical-align:top" class="mono">'+(idx+1)+'</td><td style="padding:12px"><div style="font-weight:500">'+esc(p.name)+' '+priorityBadge(p)+'</div><div style="font-size:11.5px;color:#7a6f6e;margin-top:4px">'+esc(p.desc||'')+'</div></td></tr>';
  }).join('');
  return '<div class="card" style="overflow:hidden"><table class="table"><thead><tr><th style="width:38px">#</th><th>โครงการ / กิจกรรม</th></tr></thead><tbody>'+trs+'</tbody></table></div>';
}

/* ---------- entry ---------- */

  var quarters = fyQuarters(D.fiscalYears);
  var groupsHtml = ''; eachGroup(function(g,s,u){
    var gopen = !!UI.entryOpenGroup[g.id];
    var items = g.projects.map(function(p){
      var entry = getEntry(p.id, UI.entryQuarter);

          '<span style="display:inline-block;padding:4px 11px;border-radius:20px;font-size:11px;background:'+STATUS_COLORS[entry.status]+';color:'+STATUS_TEXT[entry.status]+'">'+entry.status+'</span>' +

        '<div><div style="font-size:12.5px;font-weight:500">'+esc(p.name)+' '+priorityBadge(p,'margin-left:4px')+'</div><div style="font-size:11px;color:#9b8f8e;margin-top:4px">'+meta+'</div></div>' +
        '<div><span style="display:inline-block;padding:5px 12px;border-radius:20px;font-size:11.5px;background:'+STATUS_COLORS[entry.status]+';color:'+STATUS_TEXT[entry.status]+'">'+entry.status+'</span></div>' +
        '<div class="mono" style="font-weight:600;text-align:right">'+entry.percent+'%</div>' +
        '<div style="font-size:11.5px;color:#7a6f6e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(entry.note||'—')+'</div>' +
        '<div style="color:#c2b5b4;text-align:right">›</div></div>';
    }).join(UI.entryView==='grid' ? '' : '');

/* ---------- actions ---------- */
function attachActions(root){
  root.querySelectorAll('[data-act]').forEach(function(el){
    var act = el.getAttribute('data-act');
    var isInput = el.tagName==='INPUT' || el.tagName==='SELECT' || el.tagName==='TEXTAREA';
    el.addEventListener(isInput ? 'change' : 'click', function(e){ handleAction(act, el, e); });
  });
  var importInput = document.getElementById('import-file-input');
  if (importInput) importInput.addEventListener('change', handleImport);
}

function handleAction(act, el, e){
  var ds = el.dataset;
  var si = ds.si!==undefined ? Number(ds.si) : null, ui = ds.ui!==undefined ? Number(ds.ui) : null, gi = ds.gi!==undefined ? Number(ds.gi) : null, pi = ds.pi!==undefined ? Number(ds.pi) : null;

  if (act==='set-tab'){ if (ds.tab==='settings' && !UI.isAdmin) { UI.adminPromptOpen = true; render(); return; } UI.tab = ds.tab; render(); return; }
  if (act==='toggle-edit'){ UI.editMode = !UI.editMode; render(); return; }
  if (act==='open-admin-prompt'){ UI.adminPromptOpen = true; UI.adminInput=''; UI.adminError=''; render(); return; }
  if (act==='close-admin' || act==='close-admin-bg'){ if (act==='close-admin-bg' && e.target!==el) return; UI.adminPromptOpen = false; render(); return; }
  if (act==='admin-input'){ UI.adminInput = el.value; return; }
  if (act==='admin-submit'){
    var v = (document.getElementById('admin-code-input')||{}).value || UI.adminInput;
    if (v === ADMIN_CODE) {
      UI.isAdmin = true; UI.adminPromptOpen = false; UI.adminError=''; UI.tab = 'settings';
      try { sessionStorage.setItem('thamc_admin','1'); } catch(e2){}
    } else {
      UI.adminError = 'รหัสไม่ถูกต้อง';
    }
    render();
    return;
  }
  if (act==='open-print-dialog'){ UI.printSelection = {}; D.strategies.forEach(function(s){ UI.printSelection[s.code]=true; }); UI.printDialogOpen = true; render(); return; }
  if (act==='toggle-print-strat'){ UI.printSelection[ds.code] = !UI.printSelection[ds.code]; render(); return; }
  if (act==='toggle-print-all'){ var v = el.checked; D.strategies.forEach(function(s){ UI.printSelection[s.code]=v; }); render(); return; }
  if (act==='cancel-print' || act==='cancel-print-bg'){ if (act==='cancel-print-bg' && e.target!==el) return; UI.printDialogOpen = false; render(); return; }
  if (act==='confirm-print'){
    var codes = Object.keys(UI.printSelection).filter(function(c){ return UI.printSelection[c]; });
    UI.printFilter = codes.length && codes.length < D.strategies.length ? codes : null;
    UI.printDialogOpen = false;
    render();
    setTimeout(function(){ window.print(); }, 60);
    return;
  }

  if (act==='toggle-strat'){ UI.openStrat = {}; UI.openStrat[D.strategies[si].code] = !UI.openStrat[D.strategies[si].code]; render(); return; }
  if (act==='toggle-group'){ UI.openGroup[ds.gid] = !UI.openGroup[ds.gid]; render(); return; }
  if (act==='toggle-entry-group'){ UI.entryOpenGroup[ds.gid] = !UI.entryOpenGroup[ds.gid]; render(); return; }

  if (act==='strat-name'){ D.strategies[si].name = el.value; saveData(); return; }
  if (act==='strat-goal'){ D.strategies[si].goal = el.value; saveData(); return; }
  if (act==='strat-code'){ D.strategies[si].code = el.value; saveData(); render(); return; }
  if (act==='strat-remove'){ if (confirm('ลบยุทธศาสตร์นี้และทุกอย่างภายใน?')){ D.strategies.splice(si,1); saveData(); render(); } return; }
  if (act==='strat-add'){ D.strategies.push({ code:String(D.strategies.length+1), name:'ยุทธศาสตร์ใหม่', goal:'', subs:[] }); saveData(); render(); return; }

  if (act==='sub-name'){ D.strategies[si].subs[ui].name = el.value; saveData(); return; }
  if (act==='sub-desc'){ D.strategies[si].subs[ui].desc = el.value; saveData(); return; }
  if (act==='sub-id'){ D.strategies[si].subs[ui].id = el.value; saveData(); render(); return; }
  if (act==='sub-remove'){ if (confirm('ลบกลยุทธ์นี้และทุกอย่างภายใน?')){ D.strategies[si].subs.splice(ui,1); saveData(); render(); } return; }
  if (act==='sub-add'){ var s=D.strategies[si]; s.subs.push({ id:s.code+'.'+(s.subs.length+1), name:'กลยุทธ์ใหม่', desc:'', groups:[] }); saveData(); render(); return; }

  if (act==='grp-name'){ D.strategies[si].subs[ui].groups[gi].name = el.value; saveData(); return; }
  if (act==='grp-desc'){ D.strategies[si].subs[ui].groups[gi].desc = el.value; saveData(); return; }
  if (act==='grp-id'){ D.strategies[si].subs[ui].groups[gi].id = el.value; saveData(); render(); return; }
  if (act==='grp-remove'){ if (confirm('ลบกลุ่มนี้และโครงการภายใน?')){ D.strategies[si].subs[ui].groups.splice(gi,1); saveData(); render(); } return; }
  if (act==='grp-add'){ var u=D.strategies[si].subs[ui]; u.groups.push({ id:u.id+'.'+(u.groups.length+1), name:'กลุ่มโครงการใหม่', desc:'', projects:[] }); saveData(); render(); return; }

  if (act==='proj-name'){ D.strategies[si].subs[ui].groups[gi].projects[pi].name = el.value; saveData(); return; }
  if (act==='proj-desc'){ D.strategies[si].subs[ui].groups[gi].projects[pi].desc = el.value; saveData(); return; }
  if (act==='proj-remove'){ if (confirm('ลบโครงการนี้?')){ D.strategies[si].subs[ui].groups[gi].projects.splice(pi,1); saveData(); render(); } return; }
  if (act==='proj-add'){ D.strategies[si].subs[ui].groups[gi].projects.push({ id: uid(), name:'โครงการใหม่', desc:'' }); saveData(); render(); return; }
  if (act==='admin-toggle-priority'){ var found2 = findProject(ds.pid); if (found2) { found2.p.priority = el.checked; saveData(); render(); } return; }
  if (act==='admin-set-owner'){ setDetail(ds.pid, { owner: el.value }); return; }

  if (act==='set-entry-quarter'){ UI.entryQuarter = el.value; render(); return; }
  if (act==='set-entry-view'){ UI.entryView = ds.v; render(); return; }
  if (act==='open-modal'){ UI.modalProjectId = ds.pid; UI.modalSaved=''; render(); return; }
  if (act==='open-strat-preview'){ UI.stratPreviewCode = ds.code; render(); return; }
  if (act==='close-strat-preview' || act==='close-strat-preview-bg'){ if (act==='close-strat-preview-bg' && e.target!==el) return; UI.stratPreviewCode = null; render(); return; }
  if (act==='strat-preview-open-project'){ UI.stratPreviewCode = null; UI.previewProjectId = ds.pid; render(); return; }
  if (act==='close-modal' || act==='close-modal-bg'){ if (act==='close-modal-bg' && e.target!==el) return; UI.modalProjectId = null; render(); return; }

  if (act==='modal-status'){ setEntry(UI.modalProjectId, UI.entryQuarter, { status: ds.status }); render(); return; }
  if (act==='modal-percent'){ setEntry(UI.modalProjectId, UI.entryQuarter, { percent: Number(el.value) }); return; }
  if (act==='modal-note'){ setEntry(UI.modalProjectId, UI.entryQuarter, { note: el.value }); return; }
  if (act==='kpi-add'){
    var detA = getDetail(UI.modalProjectId);
    var kpisA = (detA.kpis||[]).concat([{ id: uid(), name:'', target:'', current:'', unit:'', fileName:'', fileData:'' }]);
    setDetail(UI.modalProjectId, { kpis: kpisA }); render(); return;
  }
  if (act==='kpi-remove'){
    var detR = getDetail(ds.pid);
    var kpisR = (detR.kpis||[]).filter(function(k){ return k.id!==ds.kid; });
    setDetail(ds.pid, { kpis: kpisR });
    applyKpiPercent(ds.pid, UI.entryQuarter); render(); return;
  }
  if (act==='kpi-field'){
    var detF = getDetail(ds.pid);
    var kpisF = (detF.kpis||[]).map(function(k){ return k.id===ds.kid ? Object.assign({}, k, ds.f==='name'||ds.f==='unit' ? (function(){var o={};o[ds.f]=el.value;return o;})() : (function(){var o={};o[ds.f]=el.value===''?'':Number(el.value);return o;})()) : k; });
    setDetail(ds.pid, { kpis: kpisF });
    applyKpiPercent(ds.pid, UI.entryQuarter); render(); return;
  }
  if (act==='kpi-current'){
    setKpiValue(ds.pid, UI.entryQuarter, ds.kid, { current: el.value===''?'':Number(el.value) });
    applyKpiPercent(ds.pid, UI.entryQuarter); render(); return;
  }
  if (act==='kpi-file-remove'){
    setKpiValue(ds.pid, UI.entryQuarter, ds.kid, { fileName:'', fileData:'' }); render(); return;
  }
  if (act==='kpi-file'){
    var file = el.files && el.files[0];
    if (!file) return;
    var pid = ds.pid, kid = ds.kid, q2 = UI.entryQuarter;
    var reader = new FileReader();
    reader.onload = function(){
      setKpiValue(pid, q2, kid, { fileName: file.name, fileData: reader.result });
      render();
    };
    reader.readAsDataURL(file);
    return;
  }
  if (act==='modal-field'){ var patch={}; patch[ds.f]=el.value; setDetail(UI.modalProjectId, patch); return; }
  if (act==='modal-start'){ setDetail(UI.modalProjectId, { startMonth: Number(el.value) }); render(); return; }
  if (act==='modal-end'){ setDetail(UI.modalProjectId, { endMonth: Number(el.value) }); render(); return; }
  if (act==='step-add'){ var d=getDetail(UI.modalProjectId); var steps=(d.steps||[]).concat([{ name:'', from:d.startMonth, to:d.startMonth }]); setDetail(UI.modalProjectId, { steps: steps }); render(); return; }
  if (act==='step-name'){ var d2=getDetail(UI.modalProjectId); var steps2=(d2.steps||[]).map(function(s,i){ return i===Number(ds.si) ? Object.assign({},s,{name:el.value}) : s; }); setDetail(UI.modalProjectId,{steps:steps2}); return; }
  if (act==='step-from'){ var d3=getDetail(UI.modalProjectId); var v=Number(el.value); var steps3=(d3.steps||[]).map(function(s,i){ return i===Number(ds.si) ? Object.assign({},s,{from:v, to:Math.max(v,s.to)}) : s; }); setDetail(UI.modalProjectId,{steps:steps3}); render(); return; }
  if (act==='step-to'){ var d4=getDetail(UI.modalProjectId); var v2=Number(el.value); var steps4=(d4.steps||[]).map(function(s,i){ return i===Number(ds.si) ? Object.assign({},s,{to:v2, from:Math.min(v2,s.from)}) : s; }); setDetail(UI.modalProjectId,{steps:steps4}); render(); return; }
  if (act==='step-remove'){ var d5=getDetail(UI.modalProjectId); var steps5=(d5.steps||[]).filter(function(s,i){ return i!==Number(ds.si); }); setDetail(UI.modalProjectId,{steps:steps5}); render(); return; }
  if (act==='modal-save'){ pushDetail(UI.modalProjectId); render(); return; }
  if (act==='preview-project-form'){ UI.previewProjectId = UI.modalProjectId; render(); return; }
  if (act==='close-preview' || act==='close-preview-bg'){ if (act==='close-preview-bg' && e.target!==el) return; UI.previewProjectId = null; render(); return; }
  if (act==='print-project-form-from-preview'){
    UI.printProjectId = ds.pid; UI.previewProjectId = null;
    render();
    document.body.classList.add('printing-project');
    setTimeout(function(){ window.print(); }, 60);
    return;
  }
  if (act==='print-project-form'){
    UI.printProjectId = UI.modalProjectId;
    render();
    document.body.classList.add('printing-project');
    setTimeout(function(){ window.print(); }, 60);
    return;
  }

  if (act==='set-sheet-url'){ D.sheetUrl = el.value; return; }
  if (act==='save-sheet-url'){ saveData(); UI.connMsg = 'บันทึก URL แล้ว'; render(); return; }
  if (act==='test-connection'){
    if (!D.sheetUrl) { UI.connMsg='กรุณากรอก URL ก่อน'; render(); return; }
    UI.connMsg = 'กำลังทดสอบ...'; render();
    fetch(D.sheetUrl).then(function(){ UI.connMsg='เชื่อมต่อสำเร็จ'; render(); }).catch(function(){ UI.connMsg='เชื่อมต่อไม่สำเร็จ — ตรวจสอบ URL และการ deploy เป็น Anyone access'; render(); });
    return;
  }

  if (act==='add-year'){
    var inp = document.getElementById('new-fy-input'); var v3 = inp && inp.value.trim();
    if (v3 && /^\d{4}$/.test(v3) && D.fiscalYears.indexOf(v3)===-1) { D.fiscalYears.push(v3); D.fiscalYears.sort(); saveData(); render(); }
    return;
  }
  if (act==='remove-year'){
    if (D.fiscalYears.length<=1) { alert('ต้องมีปีงบประมาณอย่างน้อย 1 ปี'); return; }
    D.fiscalYears = D.fiscalYears.filter(function(fy){ return fy!==ds.fy; });
    var validQuarters = fyQuarters(D.fiscalYears);
    if (validQuarters.indexOf(D.currentQuarter)===-1) D.currentQuarter = validQuarters[validQuarters.length-1];
    saveData(); render(); return;
  }
  if (act==='set-current-quarter'){ D.currentQuarter = el.value; saveData(); render(); return; }

  if (act==='export-json'){
    var blob = new Blob([JSON.stringify(D, null, 2)], {type:'application/json'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'thamc-strategy-data.json'; a.click();
    return;
  }
}

function handleImport(e){
  var file = e.target.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var parsed = JSON.parse(reader.result);
      if (!parsed.strategies || !Array.isArray(parsed.strategies)) throw new Error('bad shape');
      if (!confirm('นำเข้าไฟล์นี้จะแทนที่ข้อมูลยุทธศาสตร์/ผลดำเนินงานทั้งหมดในระบบ ยืนยันหรือไม่?')) return;
      parsed.strategies.forEach(function(s){ s.subs.forEach(function(u){ u.groups.forEach(function(g){ g.projects.forEach(function(p){ if(!p.id) p.id = uid(); }); }); }); });
      D = Object.assign({ entries:{}, details:{}, sheetUrl:'', fiscalYears:['2568','2569'], currentQuarter:'2569 Q4' }, parsed);
      saveData();
      UI.importMsg = 'นำเข้าข้อมูลสำเร็จ';
      render();
    } catch(err) {
      UI.importMsg = 'ไฟล์ไม่ถูกต้อง — ต้องเป็น JSON ที่มีโครงสร้าง {strategies:[...]} (ดาวน์โหลดตัวอย่างได้จากปุ่ม "ดาวน์โหลดข้อมูล")';
      render();
    }
  };
  reader.readAsText(file);
}

render();
window.onafterprint = function(){
  document.body.classList.remove('printing-project');
  if (UI.printFilter) { UI.printFilter = null; render(); }
  if (UI.printProjectId) { UI.printProjectId = null; render(); }
};
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
